# .github/workflows/ci.yml
# Runs the same gates as scripts/ship.sh, on a clean machine, for every pull request and every push to main.
# Required checks to set on the main ruleset: "data", "browser".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sweep mode'
        type: choice
        options: [fast, full]
        default: full
  schedule:
    # Daily at 4:23am Central (09:23 UTC) while the election is live. Checks the LIVE site, not the repo.
    # Remove after Nov 4, 2026, or keep weekly. It fails loudly if production breaks with nobody pushing.
    - cron: '23 9 * * *'

# A newer push to the same PR replaces the older run. Main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'   # Vercel builds on 24.x (project setting). Local Macs run 22; both pass.
  FORCE_COLOR: '0'

jobs:
  # A pull request that only adds a requested source's own two files (the workbench's vg source writes
  # data/endorsers-src-<id>.json and data/endorsements-src-<id>.json) skips the browser job, so a friend's source can
  # go live in minutes (Kevin, Oct 28: "yes skip them"). The data job still runs every data rule and the model tests on
  # it, and the browser job runs on main after the merge. Anything else in the diff, or this job failing, runs it all.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_only: ${{ steps.c.outputs.source_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: c
        run: |
          # --no-renames: a rename lists both paths, so moving app code onto a source's file name still runs everything.
          files=$(git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^data/(endorsers|endorsements)-src-[a-z0-9-]+\.json$'; then
            echo "source_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast, no browser. The rules from FOUNDATION.md as code, then the build (which includes the typecheck).
  data:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The gates' own decisions (address matcher, ship.sh CI and deploy logic)
        run: |
          node scripts/check-addresses.mjs --self-test
          bash scripts/ship.sh --self-test
      - name: No street addresses that are not allowlisted public offices
        run: node scripts/check-addresses.mjs
      - name: Build data bundles (also writes public/data/build-report.json)
        run: npm run data
      - name: Data rules (dates, measures, endorsements, lean basis, copy, anything the build dropped)
        run: node scripts/check-data.mjs
      - name: Model tests (save-link contract, districts, lenses, verdicts, bulk fills; no browser)
        run: node tests/model.mjs
      - name: Typecheck and production build
        run: npm run build

  # Real browser at 380px, in four parts side by side: the scripted e2e in three slices, and the every-ballot sweep.
  # In one job the e2e took 11.5 of its 12 minutes (Oct 28), so slicing it is what shortens every PR's wait (Kevin:
  # "let's split"). Each slice runs every third top-level block of tests/e2e.mjs (SHARD, inShard()). The check a merge
  # waits for is still the one named "browser": the small job after these passes only if all four parts did.
  # Skipped only when `changes` succeeded and found a source-only diff. On a push to main `changes` is skipped, so this
  # runs; if `changes` fails, this runs. A cancelled run is left cancelled: here that only happens when a newer push
  # replaces it (the concurrency group above), and the newer run decides.
  browser-part:
    needs: [changes]
    if: ${{ !cancelled() && github.event_name != 'schedule' && !(needs.changes.result == 'success' && needs.changes.outputs.source_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: e2e-1
            shard: '0/3'
          - part: e2e-2
            shard: '1/3'
          - part: e2e-3
            shard: '2/3'
          - part: sweep
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # With a test DSN (project 0, which takes nothing), so the crash-report client loads here the way it does
      # on Vercel, and the e2e catches its reports (tests/e2e.mjs, "crash reports"). Every e2e page aborts
      # Sentry's ingest otherwise, so nothing a check does is ever filed.
      - run: npm run build
        env:
          VITE_SENTRY_DSN: https://0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e@o0.ingest.us.sentry.io/0

      # Playwright's own CI guide says caching browsers rarely beats downloading them. We cache only the
      # headless shell (about 100MB) keyed on the exact Playwright version; OS libraries are installed every run.
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-shell
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Serve the production build
        run: |
          npx vite preview --port 4173 --strictPort > .tmp-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/data/index.json > /dev/null && exit 0; sleep 1; done
          cat .tmp-preview.log; exit 1

      - name: Scripted end-to-end checks (one slice)
        if: matrix.shard
        env:
          BASE: http://localhost:4173
          SHOTS_DIR: .tmp/e2e-shots
          SENTRY_E2E: '1'   # the crash-report checks fail, rather than skip, if the build above lost its DSN
          SHARD: ${{ matrix.shard }}
        run: node tests/e2e.mjs

      - name: Every-ballot sweep (fast on pull requests, full on main and manual runs)
        if: matrix.part == 'sweep'
        env:
          BASE: http://localhost:4173
          SHOTS_DIR: .tmp/sweep-shots
          MODE: ${{ (github.event_name == 'pull_request') && 'fast' || (github.event.inputs.mode || 'full') }}
          WORKERS: '4'
        run: node tests/sweep.mjs

      - name: Screenshots and report from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ matrix.part }}
          path: |
            .tmp/e2e-shots
            .tmp/sweep-shots
          retention-days: 14

  # The required check. Passes only when every browser part passed; skipped, like them, on a source-only PR.
  browser:
    needs: [changes, browser-part]
    if: ${{ !cancelled() && github.event_name != 'schedule' && !(needs.changes.result == 'success' && needs.changes.outputs.source_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every browser part passed
        run: |
          echo "browser parts: ${{ needs.browser-part.result }}"
          [ "${{ needs.browser-part.result }}" = success ]

  # The LIVE site, once a day. No checkout of data needed: the sweep reads /data from the URL it tests.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      # Fails (and GitHub emails the repo owner) only when the sweep fails twice, a minute apart. The
      # sweep exits non-zero for real failures (missing items, console errors, sideways scroll, broken
      # data), never for its warnings, so one slow response from the host does not wake anyone up.
      - name: Sweep production (one retry)
        env:
          BASE: https://vote.kevinhg.com
          MODE: ${{ github.event.inputs.mode || 'fast' }}
          SHOTS_DIR: .tmp/sweep-shots
        run: |
          if node tests/sweep.mjs; then exit 0; fi
          echo "::warning::First live sweep failed; retrying once in 60 seconds."
          sleep 60
          node tests/sweep.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-failures
          path: .tmp/sweep-shots
          retention-days: 14
