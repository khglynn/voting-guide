# The voting guide's results fetcher (Phase 1 of the results view, Nov 3, 2026).
# Plan: voting-guide-workbench/claude-plans/2026-11-03-results/PLAN-PHASE-1.md. Personal Cloudflare account only:
# deploy.sh refuses any other login. Secrets (never committed): RUN_TOKEN, SLACK_BOT_TOKEN, SLACK_LOG_CHANNEL (#gabby-log, where alerts go; src/ping.js).
name = "vg-results"
account_id = "759a850a3af3e2fbf1ab036e7eb2f231"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "RESULTS"
id = "5e0114f76ee44cfeaeba98ff932bc288"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "vg-results-archive"

[observability]
enabled = true
